name: nexamind-ai

services:

  # ==========================================
  # REDIS
  # ==========================================

  redis:
    image: redis:7-alpine

    container_name: nexamind-redis

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped


  # ==========================================
  # BACKEND
  # ==========================================

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod

    env_file:
      - ./Backend/.env

    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379

    expose:
      - "5000"

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped


  # ==========================================
  # GATEWAY
  # ==========================================

  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile.prod

    container_name: nexamind-gateway

    ports:
      - "4000:4000"

    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: redis://redis:6379

    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped


  # ==========================================
  # AUTOSCALER
  # ==========================================

  autoscaler:
    build:
      context: ./Autoscaler
      dockerfile: Dockerfile.prod

    container_name: nexamind-autoscaler

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project

    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379

    depends_on:
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy

    restart: unless-stopped


  # ==========================================
  # FRONTEND
  # ==========================================

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}

    container_name: nexamind-frontend

    ports:
      - "8080:80"

    depends_on:
      gateway:
        condition: service_healthy

    restart: unless-stopped


# ==========================================
# VOLUMES
# ==========================================

volumes:
  redis_data: