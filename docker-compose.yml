services:

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev

    env_file:
      - ./Backend/.env

    environment:
      - PORT=5000


  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev

    container_name: nexamind-frontend-dev

    ports:
      - "5173:5173"

    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true


  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile.dev

    container_name: nexamind-gateway

    ports:
      - "4000:4000"

    volumes:
      - ./Gateway:/app
      - gateway_node_modules:/app/node_modules

    depends_on:
      - backend

  redis:
    image: redis:7-alpine

    container_name: nexamind-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

  autoscaler:
    build:
      context: ./Autoscaler
      dockerfile: Dockerfile.dev

    container_name: nexamind-autoscaler

    volumes:
      - ./Autoscaler:/app
      - autoscaler_node_modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project

    depends_on:
      - redis

    environment:
      - NODE_ENV=development

volumes:
  frontend_node_modules:
  gateway_node_modules:
  redis_data:
  autoscaler_node_modules:
  